[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "accelsched"
version = "0.1.0"
description = "CPU resource placement optimization with validated solver outcomes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]
license = "MIT"

[tool.setuptools]
py-modules = ["accelsched", "m0_oracle"]
